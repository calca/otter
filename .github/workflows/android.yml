name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    # Un tag v* (es. v0.2.0) è un rilascio: oltre alle build firmate,
    # carica l'AAB su Play (job publish-internal). Il tag lo crea
    # release.yml, che poi lancia questo workflow sul tag (un tag spinto da
    # GITHUB_TOKEN non fa partire i workflow da solo).
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  # Consente di lanciarlo a mano (`gh workflow run android.yml`) senza dover
  # fare un push finto: serve a verificare la firma dopo aver configurato o
  # ruotato i secret. Senza questo trigger quel comando fallisce con HTTP 422.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        # Con i tag: il nome di versione delle build senza tag parte
        # dall'ultimo ("0.4.0+171", vedi app/build.gradle.kts).
        fetch-depth: 0

    # Un tag di rilascio dev'essere semver (vX.Y.Z) e più alto di tutti i
    # precedenti: altrimenti si ferma qui, prima di firmare e caricare su
    # Play. Di solito il tag lo crea release.yml, che lo calcola da sé;
    # questo controllo copre un tag fatto a mano.
    - name: Check release tag
      if: github.ref_type == 'tag'
      run: |
        tag="${GITHUB_REF_NAME}"
        if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error title=Invalid release tag::$tag is not vMAJOR.MINOR.PATCH"
          exit 1
        fi
        highest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -vx "$tag" | sort -V | tail -1)
        if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
          echo "::error title=Release tag not newer::$tag is not higher than $highest"
          exit 1
        fi

    - name: set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Senza i 4 secret di firma questo workflow non può produrre nulla di
    # utile. Prima li lasciava comunque proseguire: `base64 -d` di una
    # variabile vuota scriveva un release.jks vuoto, e la build falliva più
    # avanti con "Failed to read key from store: Tag number over 30 is not
    # supported" — un messaggio che non dice affatto "mancano i secret".
    # Risultato: una X rossa su ogni singolo push da quando il workflow
    # esiste, che nasconde i fallimenti veri invece di segnalarli.
    #
    # Ora la mancanza dei secret è uno skip dichiarato, non un fallimento.
    # Per configurarli: ~/Developer/otter-release-secrets/README.md (fuori
    # dal repo di proposito).
    - name: Check signing secrets
      id: signing
      env:
        KEYSTORE: ${{ secrets.KEYSTORE }}
      run: |
        if [ -n "$KEYSTORE" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "### Release build skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No \`KEYSTORE\` secret is configured, so there is nothing to sign with." >> "$GITHUB_STEP_SUMMARY"
          echo "See \`otter-release-secrets/README.md\` to set up signing." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Release build skipped::No KEYSTORE secret configured; signed artifacts were not produced."
        fi

    - name: Decode Keystore
      if: steps.signing.outputs.available == 'true'
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE }}
      run: |
        echo $ENCODED_STRING | base64 -d > release.jks

    # stable -> signed .aab for the Play Store; beta -> signed .apk as a
    # pre-release build (installable side by side with stable, see
    # CLAUDE.md's "Product flavors" section for why).
    # OTTER_BUILD_NUMBER timbra versionCode e la patch di versionName
    # (vedi app/build.gradle.kts): ogni run produce artefatti riconoscibili
    # e installabili sopra i precedenti senza disinstallare. Solo questo
    # workflow lo imposta, perché è l'unico che produce build firmate.
    - name: Build stable AAB and beta pre-release APK
      if: steps.signing.outputs.available == 'true'
      env:
        OTTER_BUILD_NUMBER: ${{ github.run_number }}
        # Su un tag v* il versionName è il tag stesso (v0.2.0 → 0.2.0);
        # altrimenti l'ultimo tag più il numero di run (0.4.0+171).
        OTTER_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        KEYSTORE_PATH: ../release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew bundleStableRelease assembleBetaRelease

    - name: Upload stable AAB (Play Store)
      if: steps.signing.outputs.available == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: app-stable-release-aab
        path: app/build/outputs/bundle/stableRelease/app-stable-release.aab

    - name: Upload beta pre-release APK
      if: steps.signing.outputs.available == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: app-beta-prerelease-apk
        path: app/build/outputs/apk/beta/release/app-beta-release.apk

  # Solo un tag di rilascio (v*) finisce sul track "internal" di Play: su
  # main si lavora, e non ogni push è una versione da dare ai tester.
  # `gh workflow run release.yml -f bump=minor` → tag → internal, disponibile
  # subito ai tester interni senza revisione. Da lì si promuove a mano
  # (closed testing, poi produzione) con play-promote.yml.
  # Job separato con concurrency: due push ravvicinati aprirebbero due edit
  # Play in parallelo, e il secondo commit fallirebbe.
  publish-internal:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency: play-publish
    steps:
    - uses: actions/checkout@v7

    - name: Check Play secret
      id: play
      env:
        PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      run: |
        if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Play upload skipped::No PLAY_SERVICE_ACCOUNT_JSON secret configured."
        fi

    - uses: actions/download-artifact@v7
      if: steps.play.outputs.available == 'true'
      with:
        name: app-stable-release-aab

    - uses: actions/setup-python@v6
      if: steps.play.outputs.available == 'true'
      with:
        python-version: '3.12'

    - name: Upload to Play (internal)
      if: steps.play.outputs.available == 'true'
      env:
        PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      run: |
        pip install --quiet google-auth requests
        python .github/scripts/play_publish.py upload \
          --aab app-stable-release.aab --track internal \
          --name "${GITHUB_REF_NAME#v}" \
          --notes-dir docs/store/whatsnew
