name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE }}
      run: |
        echo $ENCODED_STRING | base64 -d > release.jks

    # stable -> signed .aab for the Play Store; beta -> signed .apk as a
    # pre-release build (installable side by side with stable, see
    # CLAUDE.md's "Product flavors" section for why).
    - name: Build stable AAB and beta pre-release APK
      env:
        KEYSTORE_PATH: ../release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew bundleStableRelease assembleBetaRelease

    - name: Upload stable AAB (Play Store)
      uses: actions/upload-artifact@v4
      with:
        name: app-stable-release-aab
        path: app/build/outputs/bundle/stableRelease/app-stable-release.aab

    - name: Upload beta pre-release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-beta-prerelease-apk
        path: app/build/outputs/apk/beta/release/app-beta-release.apk
