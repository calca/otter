name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Il default di questa action (build cmdline-tools molto vecchio,
          # es. 12266719) non riconosce ancora "platforms;android-37.1"
          # (compileSdk 37.1, richiesto dalle dipendenze Compose alpha):
          # sdkmanager fallisce con "Failed to find package" anche se il
          # pacchetto esiste lato Google. Versione più recente verificata.
          cmdline-tools-version: 14742923
          # Il default di questo input è "tools platform-tools", e "tools"
          # (le vecchie SDK Tools, deprecate da anni) è stato rimosso dal
          # repository di Google: l'action esegue `sdkmanager tools`, che
          # ora fallisce con "Failed to find package 'tools'" ed esce 1,
          # facendo fallire la CI prima ancora di arrivare a Gradle.
          #
          # Non è una regressione del repo: rilanciando la run di un commit
          # che era passato (903fe10) ha iniziato a fallire con lo stesso
          # identico errore, a codice invariato — è il pacchetto ad essere
          # sparito lato Google, non qualcosa che abbiamo cambiato noi.
          #
          # `tools` non serviva comunque: platform/build-tools li installa
          # il passo successivo, e lint/test/assemble non usano nulla delle
          # vecchie SDK Tools.
          packages: platform-tools

      - name: Install Android SDK platform & build-tools for compileSdk 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint
        # Task-per-flavor, not bare `lint`: with the beta/stable flavors
        # (see CLAUDE.md) `lintDebug` is ambiguous, and this also directly
        # validates each flavor's own resource overrides (app/src/beta/res/).
        run: ./gradlew lintStableDebug lintBetaDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testStableDebugUnitTest testBetaDebugUnitTest --stacktrace

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/stable/debug/app-stable-debug.apk
            app/build/outputs/apk/beta/debug/app-beta-debug.apk
