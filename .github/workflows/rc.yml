name: Release candidate

# Una release candidate solo su GitHub, mai su Play: l'APK della variante
# beta (si installa accanto alla stable, applicationId .beta), firmato con la
# chiave di caricamento, come pre-release. Per provare funzioni nuove prima
# di metterle in un rilascio vero (release.yml):
#   gh workflow run rc.yml --ref rc-0.7 -f version=0.7.0-rc1
#
# Il tag è `0.7.0-rc1`, senza la "v": così non rientra nei tag di rilascio
# (v*), che lanciano android.yml e arrivano su Play, né nel calcolo della
# versione successiva di release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione della candidata, es. 0.7.0-rc1 (senza la v)"
        type: string
        required: true
      notes:
        description: "Cosa c'è da provare (testo libero)"
        type: string
        default: ""

jobs:
  rc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check the version
      run: |
        if ! [[ "${{ inputs.version }}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc[0-9]+$ ]]; then
          echo "::error title=Invalid version::${{ inputs.version }} is not X.Y.Z-rcN"
          exit 1
        fi

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE }}
      run: |
        test -n "$ENCODED_STRING" || { echo "::error::No KEYSTORE secret configured"; exit 1; }
        echo $ENCODED_STRING | base64 -d > release.jks

    # Il versionCode parte da 100000 perché non scenda sotto quello delle
    # build beta di android.yml (numero di run, ancora basso): così la
    # candidata si installa sopra una beta già presente. L'inverso no: dopo
    # una candidata, una beta di CI più bassa chiede di disinstallare.
    - name: Build the beta APK
      env:
        OTTER_VERSION_NAME: ${{ inputs.version }}
        KEYSTORE_PATH: ../release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        export OTTER_BUILD_NUMBER=$((100000 + ${{ github.run_number }}))
        ./gradlew assembleBetaRelease

    - name: Create the pre-release
      env:
        GH_TOKEN: ${{ github.token }}
        NOTES: ${{ inputs.notes }}
      run: |
        v="${{ inputs.version }}"
        cp app/build/outputs/apk/beta/release/app-beta-release.apk "calm-otter-beta-$v.apk"
        sha256sum "calm-otter-beta-$v.apk" > "calm-otter-beta-$v.apk.sha256"
        {
          echo "Candidata $v: solo su GitHub, non è su Google Play."
          echo "Variante **beta** (\"Calm Otter Beta\"): si installa accanto alla Calm Otter normale, con dati e password a parte."
          echo
          echo "Release candidate $v: GitHub only, not on Google Play. It is the **beta** build (\"Calm Otter Beta\"), installed next to the regular app with its own data and password."
          if [ -n "$NOTES" ]; then
            echo
            echo "$NOTES"
          fi
        } > notes.md
        gh release create "$v" "calm-otter-beta-$v.apk" "calm-otter-beta-$v.apk.sha256" \
          --target "$GITHUB_SHA" --prerelease \
          --title "Calm Otter $v (candidata)" --notes-file notes.md
