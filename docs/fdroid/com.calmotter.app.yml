# Bozza della ricetta per fdroiddata (metadata/com.calmotter.app.yml).
# Va proposta come merge request su https://gitlab.com/fdroid/fdroiddata;
# i testi e le immagini dello store vengono da fastlane/metadata/ in questo repo.
Categories:
  - Time
  - System
License: MIT
AuthorName: calca
WebSite: https://github.com/calca/otter
SourceCode: https://github.com/calca/otter
IssueTracker: https://github.com/calca/otter/issues
Changelog: https://github.com/calca/otter/releases

AutoName: Calm Otter

RepoType: git
Repo: https://github.com/calca/otter.git

Builds:
  - versionName: 0.6.0
    versionCode: 600
    commit: v0.6.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
      - update-java-alternatives -a
    # Il versionCode dell'app per F-Droid è derivato dalla versione
    # (major*10000 + minor*100 + patch), non dal numero di run di Play.
    prebuild: printf 'otterBuildNumber=%c\notterVersionName=%v\n' >> ../gradle.properties
    gradle:
      - stable

# docs/fdroid/version.properties lo scrive release.yml prima di creare il tag.
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: docs/fdroid/version.properties|versionCode=(\d+)|.|versionName=(.+)
